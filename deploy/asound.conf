# asound.conf — makes the Pi's headphone jack the default sound output.
#
# deploy/setup-pi.sh installs this as /etc/asound.conf.
#
# Why: Narly's cues go out of the Pi's headphone jack, by AUX cable to the Bose speaker. The
# Pi numbers its sound cards in the order it finds them, and plugging in the USB mic (the
# Fifine AM8) can change that order, so "card 0" is not always the jack. Naming the card
# ("Headphones") instead of using a number keeps the cues on the jack whatever is plugged in.

#
# The short form ("defaults.pcm.card Headphones") only takes a card number on this ALSA version,
# and with a name ALSA rejects the whole file ("card is not a string"), so every sound command
# fails. This long form takes the card's name. "plug" converts each cue to a format the jack
# accepts, so any sound file plays.

pcm.!default {
    type plug
    slave.pcm "hw:Headphones"
}

ctl.!default {
    type hw
    card "Headphones"
}

# The microphone, through ALSA's converter. Opened directly, the Fifine AM8 ("hw:Microphone",
# card 3 on 2026-09-29) recorded garbled audio: Narly asks it for 44,100 Hz and nothing converts
# it. Through "plug" it records cleanly, as `arecord -D plughw:...` did. The hint makes the mic
# library list it as "fifine_mic", and Narly picks that one over the raw device.
pcm.fifine_mic {
    type plug
    slave.pcm "hw:Microphone"
    hint {
        show on
        description "fifine Microphone, converted by ALSA"
    }
}
