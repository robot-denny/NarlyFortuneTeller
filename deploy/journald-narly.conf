# journald-narly.conf — settings for the Pi's system log (journald), where Narly's log lives.
#
# deploy/setup-pi.sh installs this as /etc/systemd/journald.conf.d/narly.conf.
#
# Why:
# - Storage=persistent keeps the log on the SD card, so it survives a reboot or a power cut.
#   Without it, the log can live only in memory and is gone when the power goes.
# - SystemMaxUse=100M caps the log at 100 MB so it can never fill the SD card.
# - SyncIntervalSec=15s writes the log to the card every 15 seconds. The default is 5 minutes,
#   so pulling the plug could lose the last 5 minutes of the log. Now it is at most 15 seconds.

[Journal]
Storage=persistent
SystemMaxUse=100M
SyncIntervalSec=15s
